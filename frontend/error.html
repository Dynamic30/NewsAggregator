<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · SkimFeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/error.css">
</head>
<body>
<div class="app">

  <header class="topnav">
    <a class="brand-mark" href="/">
      <span class="brand-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.5L19 9l-5.1 1.5L12 16l-1.9-5.5L5 9l5.1-1.5L12 2z"/></svg></span>
      <span>SkimFeed</span>
    </a>
    <div class="topnav-right">
      <button class="theme-btn" id="themeSwitch" role="switch" aria-checked="false" aria-label="Toggle dark mode">
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="main error-main">
    <section class="error-card">
      <p class="eyebrow">Error 404</p>
      <div class="error-code" aria-hidden="true">404</div>
      <h1 class="error-title">This page doesn&rsquo;t exist</h1>
      <p class="error-text">The link may be broken, or the page may have moved.</p>
      <code class="error-path" id="errorPath" hidden></code>
      <div class="error-actions">
        <a class="btn btn-primary" id="homeBtn" href="/">Back to Top News</a>
        <button class="btn btn-ghost" id="backBtn" type="button">Go back</button>
      </div>
    </section>
  </main>

</div>
<script src="/js/error.js"></script>
</body>
</html>
