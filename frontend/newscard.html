<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try { var savedTheme = JSON.parse(localStorage.getItem('skimfeed_theme')); if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme); } catch (e) {}</script>
<title>Article · SkimFeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/views.css">
</head>
<body>
<div class="app" id="app">

  <header class="topnav">
    <button class="menu-btn" id="menuBtn" aria-label="Open menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand-mark">
      <span class="brand-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.5L19 9l-5.1 1.5L12 16l-1.9-5.5L5 9l5.1-1.5L12 2z"/></svg></span>
      <span>SkimFeed</span>
    </div>
    <nav class="topnav-links">
      <button class="navbtn" data-view="top">Top News</button>
      <button class="navbtn" data-view="all">Latest News</button>
      <button class="navbtn" data-view="topics">Topics</button>
      <button class="navbtn" data-view="sources">Sources</button>
    </nav>
    <div class="topnav-right">
      <button class="theme-btn" id="themeSwitch" role="switch" aria-checked="false" aria-label="Toggle dark mode">
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
      <button class="gear-btn" id="settingsGearBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.04.05a2 2 0 11-2.83 2.83l-.05-.04a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.05.04a2 2 0 11-2.83-2.83l.04-.05a1.65 1.65 0 00.33-1.82V15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1V9a1.65 1.65 0 00-.33-1.82l-.04-.05a2 2 0 112.83-2.83l.05.04a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.05-.04a2 2 0 112.83 2.83l-.04.05a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Navigation menu">
    <div class="drawer-head">
      <div class="brand-mark">
        <span class="brand-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.5L19 9l-5.1 1.5L12 16l-1.9-5.5L5 9l5.1-1.5L12 2z"/></svg></span>
        <span>SkimFeed</span>
      </div>
      <button class="drawer-close" id="drawerCloseBtn" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <nav class="nav-list">
      <button class="nav-link" data-view="top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
        <span>Top News</span>
      </button>
      <button class="nav-link" data-view="all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Latest News</span>
      </button>
      <button class="nav-link" data-view="topics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Topics</span>
      </button>
      <button class="nav-link" data-view="sources">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 7h14M7 7l-3 7a3 3 0 006 0L7 7zM17 7l-3 7a3 3 0 006 0l-3-7z"/></svg>
        <span>Sources</span>
      </button>
    </nav>

    <div class="sidebar-section">
      <span class="sidebar-label">All topics</span>
      <div class="topic-list">
        <button class="topic-link" data-view="topic" data-cat="National"><span class="topic-dot National"></span><span>National/India</span></button>
        <button class="topic-link" data-view="topic" data-cat="Business"><span class="topic-dot Business"></span><span>Business/Economy</span></button>
        <button class="topic-link" data-view="topic" data-cat="Tech"><span class="topic-dot Tech"></span><span>Technology</span></button>
        <button class="topic-link" data-view="topic" data-cat="Sports"><span class="topic-dot Sports"></span><span>Sports</span></button>
        <button class="topic-link" data-view="topic" data-cat="Entertainment"><span class="topic-dot Entertainment"></span><span>Entertainment</span></button>
        <button class="topic-link" data-view="topic" data-cat="Science"><span class="topic-dot Science"></span><span>Science &amp; Health</span></button>
        <button class="topic-link" data-view="topic" data-cat="Education"><span class="topic-dot Education"></span><span>Education</span></button>
        <button class="topic-link" data-view="topic" data-cat="Climate"><span class="topic-dot Climate"></span><span>Environment/Climate</span></button>
        <button class="topic-link" data-view="topic" data-cat="Markets"><span class="topic-dot Markets"></span><span>Markets/Stocks</span></button>
        <button class="topic-link" data-view="topic" data-cat="Politics"><span class="topic-dot Politics"></span><span>Politics</span></button>
      </div>
    </div>

    <div class="drawer-bottom">
      <button class="settings-toggle" id="settingsOpenBtn">
        <svg class="gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.04.05a2 2 0 11-2.83 2.83l-.05-.04a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.05.04a2 2 0 11-2.83-2.83l.04-.05a1.65 1.65 0 00.33-1.82V15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1V9a1.65 1.65 0 00-.33-1.82l-.04-.05a2 2 0 112.83-2.83l.05.04a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.05-.04a2 2 0 112.83 2.83l-.04.05a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span>Settings</span>
      </button>
    </div>
  </aside>

  <main class="main" id="mainContent">
    <div class="reader-top"><button class="back-btn">&larr; Back</button></div>
    <div class="reader-body" id="readerBody"></div>
  </main>
</div>

<!-- settings modal -->
<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-header">
      <div>
        <h2 class="modal-title" id="settingsTitle">Settings</h2>
        <p class="modal-sub">Personalize your SkimFeed.</p>
      </div>
      <button class="modal-close" id="settingsCloseBtn" aria-label="Close settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="setting-row">
        <span class="setting-label" id="regionLabel">Region</span>
        <select class="region" disabled aria-labelledby="regionLabel"><option selected>India</option></select>
        <p class="setting-hint">More regions coming soon.</p>
      </div>

      <div class="setting-row">
        <span class="setting-label" id="appearanceLabel">Appearance</span>
        <div class="segmented" role="radiogroup" aria-labelledby="appearanceLabel">
          <button class="seg-btn" role="radio" data-theme="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</button>
          <button class="seg-btn" role="radio" data-theme="dark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>Dark</button>
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label" id="layoutLabel">Article layout</span>
        <div class="layout-options" role="radiogroup" aria-labelledby="layoutLabel">
          <button class="layout-btn" role="radio" data-layout="standard"><span class="layout-radio"></span><span class="lo-text"><span class="lo-name">Standard</span><span class="lo-desc">Title, image, then description</span></span></button>
          <button class="layout-btn" role="radio" data-layout="classic"><span class="layout-radio"></span><span class="lo-text"><span class="lo-name">Classic</span><span class="lo-desc">Image first, then title</span></span></button>
          <button class="layout-btn" role="radio" data-layout="compact"><span class="layout-radio"></span><span class="lo-text"><span class="lo-name">Compact</span><span class="lo-desc">Description beside a smaller image</span></span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<script src="/js/config.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/reader.js"></script>
<script src="/js/newscard.js"></script>
</body>
</html>
